name: Validate AWS infrastructure
on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/validate-infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/validate-infra.yml'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'cfn-lint>=1,<2'
      - run: cfn-lint -r eu-west-3 -t infra/dev/*.json
