# Profil DEV : environnement de développement partagé / recette (staging)
# Toutes les valeurs sensibles viennent de variables d'environnement.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.dev.fasoecole.com}
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://app.dev.fasoecole.com}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fasoecoleBD}?sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT:/app/certs/eu-west-3-bundle.pem}
    username: ${DB_USER:fasoecole_bd_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.afritechinnovations: INFO
    org.hibernate.SQL: INFO

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
