# Profil PROD : aucune valeur par défaut pour les secrets, tout vient de l'environnement.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.fasoecole.com}
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://app.fasoecole.com}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT:/app/certs/eu-west-3-bundle.pem}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    org.afritechinnovations: INFO

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
