# Profil PROD : aucune valeur par défaut pour les secrets, tout vient de l'environnement.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.fasoecole.com}
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://app.fasoecole.com}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    org.afritechinnovations: INFO
