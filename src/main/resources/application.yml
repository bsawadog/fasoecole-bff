spring:
  application:
    name: fasoecole

  datasource:
    url: jdbc:postgresql://localhost:5433/fasoecoleBD
    username: fasoecole_bd_user
    password: fasoecole_bd_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080